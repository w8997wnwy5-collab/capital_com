function fraseStile(k){
  return k === 'swing' ? 'Segnale sulle candele giornaliere, momento sulle orarie. Si tiene da qualche giorno a tre settimane.'
    : k === 'rapido' ? 'Mordi e fuggi: segnale sui quarti d\'ora, momento sui cinque minuti. Incassa tutto a +' + M.regoleDi('rapido').tp2 + 'R, mai piu\' di due ore dentro, fuori prima di sera.'
    : 'Segnale sulle orarie, momento sui quarti d\'ora. Si esce prima della chiusura: niente notti da pagare.';
}

function tabColpo(){
  var h = bannerEsempio(), prof = M.PROFILI[S.cfg.profilo];
  h += '<div class="card"><div class="h2" style="margin:0 0 4px">Quanto vuoi mettere in gioco</div>' +
    '<div class="budget"><input id="budget" type="number" inputmode="decimal" min="0" step="50" value="' + (S.cfg.budget || '') + '" placeholder="0" oninput="impostaBudget(this.value)">' +
    '<span>' + valutaConto() + '</span></div>' +
    (S.conto && S.conto.disponibile != null ? '<p class="piccolo" style="margin:-6px 0 12px">Disponibili sul conto Capital.com: <b class="num">' + soldi(S.conto.disponibile) + '</b>. ' +
      'Il budget e\' la parte che decidi di rischiare con Mirino, non tutto il conto.</p>' : '') +
    '<div class="seg" style="margin-bottom:8px">' + Object.keys(M.PROFILI).filter(function(k){ return !M.PROFILI[k].robot; }).map(function(k){
      return '<button class="' + (S.cfg.profilo === k ? 'on' : '') + '" onclick="impostaProfilo(\'' + k + '\')">' + M.PROFILI[k].nome + '</button>';
    }).join('') + '</div><p class="piccolo" style="margin:0 0 12px">' + esc(prof.frase) + '</p>' +
    '<div class="seg">' + Object.keys(M.STILI).map(function(k){
      return '<button class="' + (S.cfg.stile === k ? 'on' : '') + '" onclick="impostaStile(\'' + k + '\')">' + M.STILI[k].nome + '</button>';
    }).join('') + '</div><p class="piccolo" style="margin:8px 0 0">' + fraseStile(S.cfg.stile) + '</p></div>';

  if(!S.cfg.budget){
    return h + '<div class="card"><div class="vuoto"><b>Prima il budget</b>Scrivi quanto vuoi mettere in gioco: da li\' escono taglia, stop e margine di ogni colpo.</div></div>';
  }

  /* il piano della settimana: il budget diviso sui colpi migliori */
  var piani = classifica().filter(function(x){ return x.gioca; }).map(function(x){ var p = pianoDi(x.epic); if(p) p.epic = x.epic; return p; }).filter(Boolean);
  var rip = M.ripartisci(piani, S.cfg.budget, S.cfg.profilo);
  h += '<div class="h2">Il piano adesso<span class="r">max ' + prof.colpi + ' colpi</span></div>';
  if(rip.scelti.length){
    h += '<div class="card" style="padding:6px 14px"><table class="tab-d"><tr><th>Mercato</th><th>Ordine</th><th>Rischio</th><th>Margine</th></tr>' +
      rip.scelti.map(function(p){
        return '<tr onclick="scegli(\'' + p.epic + '\')" style="cursor:pointer"><td class="t">' + freccia(p.dir) + ' <b>' + esc(nomeDi(p.epic)) + '</b></td>' +
          '<td>' + fmt(p.dim, p.passo < 1 ? 2 : 0) + ' ' + (p.tipo === 'mercato' ? 'ora' : '@' + prezzo(p.entrata)) + '</td>' +
          '<td>' + fmt(p.perdita, 0) + '</td><td>' + fmt(p.margine, 0) + '</td></tr>';
      }).join('') + '</table></div>' +
      '<div class="kpi"><div><div class="l">Rischio totale</div><div class="v">' + fmt(rip.rischio, 0) + '</div><div class="s">' + pc(rip.rischio / S.cfg.budget, 1) + ' del budget se scattano tutti gli stop</div></div>' +
      '<div><div class="l">Margine</div><div class="v">' + fmt(rip.margine, 0) + '</div><div class="s">' + pc(rip.margine / S.cfg.budget, 0) + ' del budget bloccato</div></div>' +
      '<div><div class="l">Libero</div><div class="v">' + fmt(rip.libero, 0) + '</div><div class="s">' + valutaConto() + ' per rinforzare</div></div></div>';
  } else {
    h += '<div class="card"><div class="vuoto"><b>Nessun colpo adesso</b>Con il profilo ' + esc(prof.nome) + ' nessun mercato e\' pronto, o il budget non basta per la taglia minima.</div></div>';
  }

  /* il piano del mercato scelto */
  var ep = S.scelto;
  var top = classifica().slice(0, 8);
  h += '<div class="h2">Il colpo su</div><div class="mini" style="margin-bottom:10px">' + top.map(function(x){
    return '<span class="chip' + (x.epic === ep ? ' acc' : '') + '" onclick="scegli(\'' + x.epic + '\')">' + gradoHTML(x.an.grado) + ' ' + esc(nomeDi(x.epic)) + '</span>';
  }).join('') + '<select onchange="scegli(this.value)" style="border:1px solid var(--line);background:var(--card2);border-radius:9px;padding:5px 8px;font-size:12px">' +
    '<option value="">Altro…</option>' + epicsVivi().filter(function(e){ return S.analisi[e] && S.analisi[e].ok; }).map(function(e){
      return '<option value="' + esc(e) + '"' + (e === ep ? ' selected' : '') + '>' + esc(nomeDi(e)) + '</option>';
    }).join('') + '</select></div>';
  h += schedaPiano(ep);
  return h;
}

function schedaPiano(ep){
  var an = S.analisi[ep];
  if(!an || !an.ok) return '<div class="card"><div class="vuoto"><b>' + esc(nomeDi(ep)) + '</b>' + esc((an && an.motivo) || 'Nessun dato') + '</div></div>';
  var p = pianoDi(ep), mk = S.mercati[ep] || {}, prof = M.PROFILI[S.cfg.profilo], st = M.STILI[S.cfg.stile];
  if(!p) return '';
  ricordaPiano(ep, p);
  var h = '', dec = p.passo < 1 ? 2 : 0, qta = fmt(p.dim, dec);
  var chiuso = mk.stato && mk.stato !== 'TRADEABLE';
  var orario = mk.orari ? M.orari(mk.orari, Date.now()) : null;

  if(!an.grado){
    h += '<div class="nota">Nessun segnale su ' + esc(nomeDi(ep)) + ': punteggio ' + M.segno(an.punti) + '. Il piano qui sotto e\' quello che servirebbe se entrassi ' +
      (an.dir >= 0 ? 'lungo' : 'corto') + ' adesso, ma il motore non lo farebbe.</div>';
  } else if(!p.ammesso){
    h += '<div class="nota amb">Il profilo ' + esc(prof.nome) + ' non giocherebbe un grado ' + an.grado + '. Se entri lo stesso, ecco come: la taglia e\' gia\' ridotta.</div>';
  }

  var tipoTesto = p.tipo === 'mercato' ? 'a mercato' : p.tipo === 'limite' ? 'con ordine limite a <span class="q">' + prezzo(p.entrata) + '</span>' : 'con ordine stop a <span class="q">' + prezzo(p.entrata) + '</span>';
  h += '<div class="hero"><svg class="mirino" viewBox="0 0 100 100" aria-hidden="true">' + MIRINO_SVG + '</svg>' +
    '<div class="l">' + esc(nomeDi(ep)) + ' · ' + esc(ep) + ' · grado ' + (an.grado || '—') + ' · ' + M.segno(an.punti) + '</div>' +
    '<div class="v ordine">' + (p.ok ? (verbo(p.dir).charAt(0).toUpperCase() + verbo(p.dir).slice(1)) + ' <span class="q">' + qta + '</span> ' + tipoTesto : 'Il budget non basta') + '</div>' +
    '<div class="s">' + esc(p.motivoTempo) + (chiuso ? ' Adesso e\' chiuso' + (orario && orario.apre ? ': riapre ' + giornoOra(orario.apre) : '') + '.' : '') + '</div>' +
    '<div class="riga"><div>Entrata<b>' + prezzo(p.entrata) + '</b></div><div>Stop<b>' + prezzo(p.stop) + '</b></div>' +
    '<div>Obiettivi<b>' + prezzo(p.tp1) + ' · ' + prezzo(p.tp2) + '</b></div></div></div>';

  var Rg = M.regoleDi(S.cfg.stile), m1 = p.dim / 2 * Rg.tp1 * p.R * p.cambio, m2 = p.dim / 2 * Rg.tp2 * p.R * p.cambio;
  h += '<div class="card"><div class="liv">' +
    rigaLivello('Entrata', p.tipo === 'mercato' ? 'a mercato' : p.tipo === 'limite' ? 'ordine limite' : 'ordine stop', p.entrata, '', 'var(--mute)') +
    rigaLivello('Stop', pcS((p.stop - p.entrata) / p.entrata, 1), p.stop, '<span class="neg">' + soldiS(-p.perdita) + '</span>', 'var(--warn)') +
    rigaLivello('Obiettivo 1', 'chiudi meta\' · ' + pcS((p.tp1 - p.entrata) / p.entrata, 1), p.tp1, '<span class="pos">' + soldiS(m1) + '</span>', 'var(--ok)') +
    rigaLivello('Obiettivo 2', 'chiudi il resto · ' + pcS((p.tp2 - p.entrata) / p.entrata, 1), p.tp2, '<span class="pos">' + soldiS(m2) + '</span>', 'var(--ok)', true) +
    '</div></div>';

  h += '<div class="kpi"><div><div class="l">Rischio</div><div class="v neg">' + fmt(p.perdita, 0) + '</div><div class="s">' + pc(p.budget ? p.perdita / p.budget : 0, 1) + ' del budget, se scatta lo stop</div></div>' +
    '<div><div class="l">Se va</div><div class="v pos">' + fmt(p.guadagnoPiano, 0) + '</div><div class="s">meta\' al primo, meta\' al secondo</div></div>' +
    '<div><div class="l">Margine</div><div class="v">' + fmt(p.margine, 0) + '</div><div class="s">leva ' + M.fmtLeva(p.leva) + ' · valore ' + fmt(p.valore, 0) + '</div></div></div>';

  /* Le istruzioni per il biglietto d'ordine di Capital.com, con i numeri
     scritti come li scrive Capital.com: virgola per i decimali, niente
     separatore delle migliaia. La divisione in due posizioni (meta' al primo
     obiettivo la incassa Capital.com da sola) si propone solo se tutte e due
     le meta' stanno sopra la taglia minima: con budget piccoli non ci stanno,
     e allora una posizione sola con take profit al primo obiettivo. */
  var cc = function(x){ return x.toFixed(M.decimaliPer(x)).replace('.', ','); };
  var qq = function(x){ return x.toFixed(dec).replace('.', ','); };
  var meta1 = M.giuAlPasso(p.dim / 2, p.passo), meta2 = +(p.dim - meta1).toFixed(6);
  var dividi = meta1 > 0 && meta2 > 0 && (!p.dimMin || (meta1 >= p.dimMin - 1e-9 && meta2 >= p.dimMin - 1e-9));
  var dove = p.tipo === 'mercato' ? '' : ' come <b>ordine in attesa</b> a <b class="num">' + cc(p.entrata) + '</b> (' +
    (p.tipo === 'limite' ? (p.dir > 0 ? 'piu\' in basso di adesso: entri solo se ci torna' : 'piu\' in alto di adesso: entri solo se ci torna')
                         : (p.dir > 0 ? 'piu\' in alto di adesso: entri solo se rompe' : 'piu\' in basso di adesso: entri solo se sfonda')) + ')';
  var impostazioni = function(tp){
    return 'Con l\'<b>ingranaggio</b> accanto al campo imposta' + (p.tipo === 'mercato' ? '' : ' il prezzo dell\'ordine <b class="num">' + cc(p.entrata) + '</b>,') +
      ' <b>stop loss</b> <b class="num">' + cc(p.stop) + '</b> e <b>take profit</b> <b class="num">' + cc(tp) + '</b>.';
  };
  h += '<div class="card"><div class="h2" style="margin:0 0 8px">Su Capital.com</div><ol class="elenco">' +
    '<li>Apri <b>' + esc(nomeDi(ep)) + '</b> e tocca <b>' + (p.dir > 0 ? 'Compra' : 'Vendi') + '</b>' + dove + '.</li>' +
    (dividi
      ? '<li>Nel campo <b>Azioni</b> scrivi <b class="num">' + qq(meta1) + '</b>. ' + impostazioni(p.tp1) + ' Conferma.</li>' +
        '<li>Rifai lo stesso con <b class="num">' + qq(meta2) + '</b> azioni e take profit <b class="num">' + cc(p.tp2) + '</b>. Cosi\' la prima meta\' la incassa Capital.com da sola.</li>'
      : '<li>Nel campo <b>Azioni</b> scrivi <b class="num">' + qq(p.dim) + '</b>: una posizione sola, perche\' dividerla in due farebbe pezzi sotto la taglia minima di Capital.com' +
        (p.dimMin ? ' (' + qq(p.dimMin) + ')' : '') + '. ' + impostazioni(p.tp1) + ' Conferma.</li>') +
    '<li>Controllo: il <b>requisito di margine</b> deve venire in tutto circa <b class="num">' + fmt(p.margine, p.margine < 20 ? 1 : 0) + ' ' + valutaConto() + '</b> (leva ' + M.fmtLeva(p.leva) + '). ' +
      'Se Capital.com ne chiede circa ' + fmt(p.valore, p.valore < 20 ? 1 : 0) + ', sul tuo conto la leva e\' 1:1: il rischio non cambia, blocchi solo piu\' margine.</li>' +
    '<li>' + (S.modo === 'vero' ? 'Quando l\'ordine scatta la posizione la vedo comparire da sola. Se vuoi, premi <b>Sono entrato</b>.' : 'Premi <b>Sono entrato</b> qui sotto.') + '</li></ol></div>';

  /* le probabilita', dal backtest */
  var cal = S.calib && an.grado ? S.calib.perGrado[an.grado] : null;
  h += '<div class="h2">Quante volte va bene</div>';
  if(cal && cal.n >= 10){
    h += '<div class="card"><p style="margin:0;font-size:14.5px;line-height:1.55">Rigiocando la storia di tutti i mercati della lista, i segnali di grado <b>' + an.grado +
      '</b> sono stati <b>' + cal.n + '</b>: <b>' + fmt(cal.pVinceStima * 100, 0) + '%</b> chiusi in guadagno, primo obiettivo toccato nel ' + fmt(cal.pTp1Stima * 100, 0) +
      '%, <b>' + erre(cal.rMedioStima) + '</b> in media a colpo.</p>' +
      '<div class="kpi" style="margin:12px 0 0"><div><div class="l">Vince</div><div class="v">' + fmt(cal.pVinceStima * 100, 0) + '%</div></div>' +
      '<div><div class="l">Media</div><div class="v ' + (cal.rMedioStima >= 0 ? 'pos' : 'neg') + '">' + erre(cal.rMedioStima) + '</div></div>' +
      '<div><div class="l">Atteso</div><div class="v ' + (cal.rMedioStima >= 0 ? 'pos' : 'neg') + '">' + conSegno(cal.rMedioStima * p.perdita, 0) + '</div><div class="s">' + valutaConto() + ' a colpo</div></div></div>' +
      '<p class="piccolo" style="margin:10px 0 0">In media su tanti colpi, non questa volta. ' +
      (S.modo === 'esempio' ? '<b>Con i dati d\'esempio questi numeri non valgono niente.</b>' : 'Dettagli nella scheda Precisione.') + '</p></div>';
  } else {
    h += '<div class="card"><p class="piccolo" style="margin:0">Troppi pochi colpi di questo grado nella storia per dire una percentuale onesta.</p></div>';
  }

  /* la previsione */
  var prev = M.previsione(an, S.deriveCal, st.orizzonte);
  var serie = S.cs[ep].slice(-60).map(function(c){ return { v: c.c, etichetta: giorno(c.t) + ' · ' + prezzo(c.c) }; });
  h += '<div class="h2">Dove puo\' andare<span class="r">' + st.orizzonte + ' ' + st.unita + '</span></div><div class="card">' +
    graficoPrezzo('g-prev', serie, { cono: prev, unita: st.unita, titolo: 'Prezzo e previsione di ' + nomeDi(ep),
      livelli: [{ n: 'stop', v: p.stop, c: 's' }, { n: 'ob.1', v: p.tp1, c: 't' }, { n: 'ob.2', v: p.tp2, c: 't' }, { n: 'entra', v: p.entrata, c: 'e' }],
      etichettaX: [giorno(S.cs[ep][Math.max(0, S.cs[ep].length - 60)].t), '+' + st.orizzonte + ' ' + st.unita] }) +
    '<div class="etichette"><span><i style="border-color:var(--accent)"></i>centro</span><span><i style="border-color:var(--warn)"></i>stop</span>' +
    '<span><i style="border-color:var(--ok)"></i>obiettivi</span><span>fascia: 68% e 90%</span></div>' +
    '<p style="font-size:14px;line-height:1.5;margin:12px 0 0">Fra ' + st.orizzonte + ' ' + st.unita + ', due volte su tre fra <b class="num">' + prezzo(prev.b68[0]) + '</b> e <b class="num">' + prezzo(prev.b68[1]) +
    '</b>; nove su dieci fra ' + prezzo(prev.b90[0]) + ' e ' + prezzo(prev.b90[1]) + '. ' +
    (Math.abs(prev.z) < 0.05 ? 'La storia non da\' una direzione a questo grado: il centro resta sul prezzo di oggi.'
      : 'Il centro (' + prezzo(prev.centro) + ', ' + pcS(prev.mossaAttesa, 1) + ') e\' quanto si e\' mosso in media il prezzo dopo segnali di grado ' + an.grado + ', su ' + prev.n + ' casi.') + '</p></div>';

  /* il perche' */
  h += '<div class="h2">Perche\'</div><div class="card"><div class="parti">' + partiHTML(an) + '</div></div>';

  /* gli avvisi */
  var note = p.avvisi.slice();
  if(p.liquidazione && isFinite(p.liquidazione.prezzo) && p.liquidazione.perc < 0.5) note.push('Senza stop, Capital.com ti chiuderebbe verso ' + prezzo(p.liquidazione.prezzo) + ' (' + pcS(-p.dir * p.liquidazione.perc, 0) + '), se il budget fosse tutto il conto.');
  if(S.cfg.stile === 'swing' && p.costoNotte > 0) note.push('Ogni notte dentro costa circa ' + soldi(p.costoNotte, 2) + ' di finanziamento (sul valore intero, non sul margine).');
  if(p.levaEffettiva > 0) note.push('Esposizione: ' + fmt(p.levaEffettiva, 1) + ' volte il budget, un 1% di movimento vale ' + soldi(p.valore * 0.01) + '. ' +
    (p.levaEffettiva < 1 ? 'Si muove tanto, quindi lo stop e\' lontano e la posizione piccola: la leva qui serve a bloccare meno margine. Sugli indici l\'esposizione sale.'
                         : 'La leva ' + M.fmtLeva(p.leva) + ' decide il margine; la perdita la decide lo stop.'));
  if(note.length) h += '<div class="card piatta"><ul class="elenco" style="margin:0">' + note.map(function(n){ return '<li>' + esc(n) + '</li>'; }).join('') + '</ul></div>';

  h += '<div class="fila" style="margin-top:6px"><button class="btn acc" onclick="sonoEntrato(\'' + ep + '\')"' + (p.ok ? '' : ' disabled') + '>Sono entrato</button></div>';
  return h;
}

function rigaLivello(nome, desc, v, soldiTesto, colore, ultima){
  var c = ultima ? ' ult' : '';
  return '<div class="n' + c + '"><i style="background:' + colore + '"></i>' + esc(nome) + '</div><div class="d' + c + '">' + esc(desc) + '</div>' +
    '<div class="p' + c + '">' + prezzo(v) + '</div><div class="m' + c + '">' + (soldiTesto || '') + '</div>';
}

var NOMI_PARTI = {
  trend: 'Trend', momento: 'Momento', macd: 'Accelerazione', rottura: 'Rottura', estensione: 'Estensione',
  forzaRel: 'Forza rel.', regime: 'Indice', folla: 'Folla'
};
function perche(k, v, an){
  if(k === 'trend') return v > 0.3 ? 'Prezzo sopra le medie, medie in salita.' : v < -0.3 ? 'Prezzo sotto le medie, medie in discesa.' : 'Medie intrecciate: nessuna strada chiara.';
  if(k === 'momento') return v > 0.3 ? 'Negli ultimi 20 e 60 periodi e\' salito piu\' di quanto oscilla di solito.' : v < -0.3 ? 'Negli ultimi 20 e 60 periodi e\' sceso piu\' di quanto oscilla di solito.' : 'Rendimento recente nella norma.';
  if(k === 'macd') return v > 0.2 ? 'Sta accelerando verso l\'alto.' : v < -0.2 ? 'Sta accelerando verso il basso.' : 'Velocita\' costante.';
  if(k === 'rottura') return v > 0.6 ? 'Ha chiuso sopra il massimo delle ultime 20 candele.' : v < -0.6 ? 'Ha chiuso sotto il minimo delle ultime 20 candele.' : 'Dentro il canale delle ultime 20 candele.';
  if(k === 'estensione') return v < -0.15 ? 'Tirato verso l\'alto (RSI ' + fmt(an.rsi, 0) + '): comprare qui vuol dire stop lontano.' : v > 0.15 ? 'Tirato verso il basso (RSI ' + fmt(an.rsi, 0) + '): vendere qui vuol dire stop lontano.' : 'Non tirato: RSI ' + fmt(an.rsi, 0) + '.';
  if(k === 'forzaRel') return v > 0.2 ? 'Fa meglio dell\'indice.' : v < -0.2 ? 'Fa peggio dell\'indice.' : 'Va come l\'indice.';
  if(k === 'regime') return v > 0.5 ? 'L\'indice di riferimento e\' in trend su.' : v < -0.5 ? 'L\'indice di riferimento e\' in trend giu\'.' : 'L\'indice di riferimento e\' incerto.';
  if(k === 'folla') return fmt(an.percLunghi, 0) + '% dei clienti Capital.com e\' lungo. Si legge al contrario: la folla compra quello che scende.';
  return '';
}
function partiHTML(an){
  return Object.keys(NOMI_PARTI).filter(function(k){ return an.parti[k] != null; }).map(function(k){
    var v = an.parti[k];
    return '<div class="parte"><span class="nome">' + NOMI_PARTI[k] + '</span>' + barraPunti(Math.round(v * 100)) +
      '<span class="perche">' + esc(perche(k, v, an)) + '</span></div>';
  }).join('') + '<p class="piccolo" style="margin:6px 0 0">ADX ' + fmt(an.adx, 0) + (an.adx < 20 ? ': poca direzione, trend e momento pesano meno.' : ': il mercato ha una direzione.') + '</p>';
}

/* ══════════════════════════════════════════════════════════════
   IN GIOCO
   ══════════════════════════════════════════════════════════════ */
function tabGioco(){
  var h = bannerEsempio(), lista = posizioniTutte();
  var conC = lista.map(function(p){ return { p: p, c: consiglioDi(p) }; });
  conC.sort(function(a, b){ return (a.c ? M.VERDETTI[a.c.verdetto].ordine : 9) - (b.c ? M.VERDETTI[b.c.verdetto].ordine : 9); });
  if(!lista.length){
    h += '<div class="card"><div class="vuoto"><b>Nessuna posizione aperta</b>' +
      (S.modo === 'vero' ? 'Quando apri una posizione su Capital.com la vedo comparire da sola, entro pochi secondi.' : 'Quando entri, premi <b>Sono entrato</b> nel Colpo.') +
      '</div></div>';
  } else {
    var tot = 0;
    conC.forEach(function(x){ if(x.c) tot += x.c.pnlConto; });
    h += '<div class="kpi"><div><div class="l">Posizioni</div><div class="v">' + lista.length + '</div></div>' +
      '<div><div class="l">Aperto</div><div class="v ' + (tot >= 0 ? 'pos' : 'neg') + '">' + conSegno(tot, 0) + '</div><div class="s">' + valutaConto() + '</div></div>' +
      '<div><div class="l">Da fare</div><div class="v">' + urgenti() + '</div><div class="s">consigli da seguire</div></div></div>';
    conC.forEach(function(x){ h += schedaPosizione(x.p, x.c); });
  }
  h += '<div class="fila" style="margin:4px 0 0"><button class="btn" onclick="apriManuale()">Aggiungi a mano</button></div>';
  if(S.modo === 'vero'){
    h += '<p class="piccolo" style="margin:12px 3px 0">' + (S.ponte && S.ponte.telegram && S.ponte.memoria
      ? 'Il ponte sorveglia le posizioni anche con l\'app chiusa: quando un consiglio cambia, arriva su Telegram. ' +
        (S.cfg.avvisiIngresso !== false ? 'E ti scrive anche quando un mercato della lista e\' pronto per entrare.' : '')
      : 'Con l\'app chiusa nessuno ti avvisa. Accendi gli avvisi su Telegram: istruzioni nella scheda Ponte.') + '</p>';
  }
  h += libroHTML();
  return h;
}

function schedaPosizione(p, c){
  var mk = S.mercati[p.epic] || {}, h = '<div class="card">';
  h += '<div class="pos-testa">' + pillola(p.dir) + '<div class="nm"><b>' + esc(nomeDi(p.epic)) + '</b><div>' + fmt(p.dim, p.dim % 1 ? 2 : 0) + ' a ' + prezzo(p.entrata) +
    ' · da ' + durata(Date.now() - p.aperta) + ' · ' + (p.robot ? 'robot' : p.capital ? 'Capital.com' : 'a mano') + '</div></div>' +
    (c ? '<div class="num ' + (c.pnlConto >= 0 ? 'pos' : 'neg') + '" style="font-weight:700;font-size:16px">' + soldiS(c.pnlConto) + '</div>' : '') + '</div>';
  if(!c){ return h + '<p class="piccolo">Nessun prezzo per ' + esc(p.epic) + ' adesso.</p></div>'; }
  h += '<div class="verdetto ' + c.tono + '"><div class="t">' + esc(c.titolo) + '</div><div class="f">' + esc(c.frase) + '</div></div>';
  h += '<div class="cifre"><div><div class="l">Prezzo</div><div class="v">' + prezzo(c.uscita) + '</div></div>' +
    '<div><div class="l">In R</div><div class="v ' + (c.rOra >= 0 ? 'pos' : 'neg') + '">' + erre(c.rOra) + '</div></div>' +
    '<div><div class="l">Stop</div><div class="v">' + prezzo(c.stopEff) + '</div></div></div>';
  var ct = S.ct[p.epic];
  if(ct && ct.length > 5){
    var serie = ct.slice(-80).map(function(x){ return { v: x.c, etichetta: giornoOra(x.t) + ' · ' + prezzo(x.c) }; });
    h += graficoPrezzo('g-pos-' + p.id, serie, { alto: 170, titolo: 'Andamento di ' + nomeDi(p.epic),
      livelli: [{ n: 'entrata', v: p.entrata, c: 'e' }, { n: 'stop', v: c.stopEff, c: 's' }, { n: 'ob.1', v: c.tp1, c: 't' }, { n: 'ob.2', v: c.tp2, c: 't' }] });
  }
  var righe = c.motivi.slice(c.verdetto === 'attento' ? 1 : 0).concat(c.info);
  if(righe.length) h += '<ul class="elenco">' + righe.map(function(r){ return '<li>' + esc(r) + '</li>'; }).join('') + '</ul>';
  if(p.robot){
    return h + '<p class="piccolo" style="margin:10px 0 0"><b>La gestisce il robot</b>: stop e take profit sono su Capital.com, e al giro di ogni minuto ' +
      'il robot sposta lo stop o la chiude da solo. Non serve fare niente.</p></div>';
  }
  var az = [];
  if(!p.parziale && c.rMax >= M.regoleDi(S.cfg.stile).tp1 * 0.9) az.push('<button class="btn picc ok" onclick="segna(\'' + esc(p.id) + '\',\'parziale\')">Ho preso meta\'</button>');
  if(c.verdetto === 'stop' || (p.manuale && c.faseStop !== 'iniziale')) az.push('<button class="btn picc" onclick="segna(\'' + esc(p.id) + '\',\'stop\')">Stop spostato a ' + prezzo(c.stopRegola) + '</button>');
  if(c.verdetto === 'rinforza') az.push('<button class="btn picc" onclick="segna(\'' + esc(p.id) + '\',\'rinforzata\')">Ho rinforzato</button>');
  if(p.manuale) az.push('<button class="btn picc ' + (c.tono === 'rosso' ? 'ko' : '') + '" onclick="apriChiusura(\'' + esc(p.id) + '\')">Ho chiuso</button>');
  if(az.length) h += '<div class="fila" style="margin-top:10px">' + az.join('') + '</div>';
  if(p.capital) h += '<p class="piccolo" style="margin:10px 0 0">Quando la chiudi su Capital.com sparisce da qui e finisce nel libro.</p>';
  return h + '</div>';
}

function libroHTML(){
  var libro = leggi(CHIAVI.libro, []);
  if(!libro.length) return '';
  var tot = 0, vinte = 0, rs = [];
  libro.forEach(function(x){ tot += x.pnl; if(x.pnl > 0) vinte++; if(x.r != null) rs.push(x.r); });
  var h = '<div class="h2">Il libro<span class="r">' + libro.length + ' chiuse</span></div>' +
    '<div class="kpi"><div><div class="l">Risultato</div><div class="v ' + (tot >= 0 ? 'pos' : 'neg') + '">' + conSegno(tot, 0) + '</div><div class="s">' + valutaConto() + '</div></div>' +
    '<div><div class="l">Vinte</div><div class="v">' + fmt(vinte / libro.length * 100, 0) + '%</div></div>' +
    '<div><div class="l">R medio</div><div class="v">' + (rs.length ? erre(rs.reduce(function(a, b){ return a + b; }, 0) / rs.length) : '—') + '</div></div></div>';
  h += '<div class="card" style="padding:6px 14px"><table class="tab-d"><tr><th>Mercato</th><th>Chiusa</th><th>R</th><th>' + valutaConto() + '</th></tr>' +
    libro.slice(0, 30).map(function(x){
      return '<tr><td class="t">' + (x.dir > 0 ? '▲ ' : '▼ ') + esc(x.nome) + '</td><td>' + giorno(x.chiusa) + '</td><td>' + (x.r != null ? erre(x.r) : '—') + '</td>' +
        '<td class="' + (x.pnl >= 0 ? 'pos' : 'neg') + '">' + (x.approssimato ? '≈' : '') + conSegno(x.pnl, 0) + '</td></tr>';
    }).join('') + '</table></div><p class="piccolo" style="margin:0 3px">≈ chiusa su Capital.com: l\'uscita e\' l\'ultimo prezzo visto, non quello esatto.</p>';
  return h;
}

/* ══════════════════════════════════════════════════════════════
   IL ROBOT

   Vive nel ponte, non qui: il telefono lo accende, lo spegne e lo
   guarda. Cosi' lavora anche con l'app chiusa, e se il telefono si
   spegne non succede niente di strano. Le regole sono quelle del
   motore, profilo Estremo, una posizione sola per colpo; il freno e' la
   perdita massima dall'avvio.
   ══════════════════════════════════════════════════════════════ */
function idRobot(){
  var m = {};
  ((S.robot && S.robot.robot && S.robot.robot.aperte) || []).forEach(function(a){ m[a.id] = a; });
  return m;
}

function caricaRobot(){
  if(S.modo !== 'vero') return Promise.resolve();
  return chiediPonte('/api/robot').then(function(d){
    S.robot = d; S.robotQuando = Date.now();
    if(S.tab === 'robot' && !S.foglio) render();
  }, function(e){
    /* un ponte vecchio non conosce /api/robot: va ricopiato */
    S.robot = /niente qui/i.test(e.message) ? { vecchio: true } : { errore: e.message };
    S.robotQuando = Date.now();
    if(S.tab === 'robot' && !S.foglio) render();
  });
}

/* Le regole del robot rigiocate sulla storia: una posizione sola, profilo
   Estremo, al massimo N posizioni aperte insieme. */
function storiaRobot(){
  var st = M.STILI[S.cfg.stile], posti = Math.max(1, Math.min(10, S.cfg.robotPosti || 10));
  var chiave = S.cfg.stile + '|' + posti + '|' + S.cfg.lista.join(',') + '|' + S.ultimoGiro;
  if(S.robotStoria && S.robotStoria.chiave === chiave) return S.robotStoria;
  var colpi = [];
  S.cfg.lista.forEach(function(ep){
    if(!S.cs[ep] || S.cs[ep].length < M.CALDO) return;
    var mk = S.mercati[ep] || {};
    var bt = M.backtest(S.cs[ep], { rif: ep === S.cfg.riferimento ? null : S.rifSer, soglia: M.sogliaProfilo('estremo'), stile: S.cfg.stile,
                                    notte: mk.notte || undefined, unaSola: true });
    bt.colpi.forEach(function(c){ c.epic = ep; colpi.push(c); });
  });
  var presi = M.portafoglio(colpi, posti);
  S.robotStoria = { chiave: chiave, r: M.riassumi(presi), colpi: presi, unita: st.unita };
  return S.robotStoria;
}

function robotRegoleHTML(stile){
  stile = M.STILI[stile] ? stile : S.cfg.stile;
  var Rg = M.regoleDi(stile), St = M.STILI[stile], tetto = S.cfg.robotPerdita || 50, v = valutaConto();
  var quanti = stile === 'rapido' ? 2 : 1;
  var tempo = stile === 'swing' ? St.maxBarre + ' giorni' : stile === 'rapido' ? (St.maxBarre / 4) + ' ore' : St.maxBarre + ' ore';
  return '<div class="h2">Come gioca<span class="r">' + St.nome + '</span></div><div class="card"><ul class="elenco" style="margin:0">' +
    '<li>Guarda ' + (quanti === 1 ? 'un mercato' : quanti + ' mercati') + ' della lista al minuto, a rotazione. Entra quando il segnale e\' A, B o C <b>e</b> il momento e\' "entra ora": mai a prezzo scappato.</li>' +
    '<li>Gioca per il massimo. La taglia si ragiona sulla <b>perdita massima</b>: con ' + fmt(tetto, 0) + ' ' + esc(v) + ' rischia ' + fmt(M.rischioRobot(tetto, 'A'), 2) + ' su un A, ' +
      fmt(M.rischioRobot(tetto, 'B'), 2) + ' su un B, ' + fmt(M.rischioRobot(tetto, 'C'), 2) + ' su un C. Con un conto piccolo il limite vero e\' il margine: ne usa fino al ' +
      Math.round(M.ROBOT.margineUsabile * 100) + '%, con la leva al massimo se l\'hai scelta.</li>' +
    '<li>Ogni posizione nasce con <b>stop loss</b> (' + Rg.stopAtr + ' ATR) e <b>take profit</b> (+' + Rg.tp2 + 'R) gia\' su Capital.com: se il ponte si ferma, restano.</li>' +
    '<li>A +' + Rg.pareggioDa + 'R porta lo stop a pareggio; da +' + Rg.tp1 + 'R lo stop insegue il prezzo a ' + Rg.trailAtr + ' ATR. Niente meta\': o tutto al take profit, o lo stop.</li>' +
    '<li>Esce se il segnale si gira, dopo ' + tempo + (St.chiudiASera ? ', o prima della chiusura' : '') + '.' +
      (stile === 'rapido' ? ' Sullo stesso mercato puo\' rientrare dopo un quarto d\'ora: entra, incassa, esce, rientra.' : '') + '</li>' +
    '<li>Non mette mai a rischio piu\' di quanto resta della perdita massima. Se la perdita dall\'avvio la raggiunge, si ferma da solo e chiude tutto.</li>' +
    '<li>Non tocca le posizioni che apri tu. Pero\' contano nei posti e nella perdita dall\'avvio.</li></ul></div>';
}

function robotStoriaHTML(){
  var s = storiaRobot(), r = s.r;
  if(!r.n) return '';
  var rischioMedio = M.rischioRobot(S.cfg.robotPerdita || 50, 'B');
  return '<div class="h2">Sulla storia<span class="r">' + r.n + ' colpi · ' + M.STILI[S.cfg.stile].nome + '</span></div><div class="card">' +
    '<p style="margin:0 0 10px;font-size:14px;line-height:1.5">Le stesse regole del robot rigiocate sulla storia dei mercati della lista, con al massimo ' +
    (S.cfg.robotPosti || 10) + ' posizioni insieme: <b>' + fmt(r.pVince * 100, 0) + '%</b> in guadagno, <b>' + erre(r.rMedio) + '</b> a colpo, peggior serie <b>' +
    fmt(-r.maxDD, 1) + 'R</b> (circa ' + soldiS(-r.maxDD * rischioMedio) + ' con il tuo tetto' +
    (r.maxDD * rischioMedio > (S.cfg.robotPerdita || 50) ? ': il robot si sarebbe fermato prima, a ' + soldiS(-(S.cfg.robotPerdita || 50)) : '') + ').</p>' +
    graficoCurva('g-robot', s.colpi) +
    (S.modo === 'esempio' ? '<div class="nota warn"><b>Dati inventati:</b> questi numeri non valgono niente.</div>'
                          : '<p class="piccolo" style="margin:8px 0 0">Storia, non promessa. Spread, notti e slittamento degli stop sono compresi; le notizie e i buchi del lunedi\' no.' +
                            (S.cfg.stile === 'rapido' ? ' Sui quarti d\'ora lo spread pesa di piu\': se qui il risultato a colpo e\' sotto zero, sul conto vero lo sara\' anche di piu\'.' : '') + '</p>') + '</div>';
}

/* Perche' non apre: l'ultima occhiata a ogni mercato, come la scrive il ponte */
function vistiHTML(rb, adesso){
  var v = rb.visti || {}, chiavi = Object.keys(v);
  if(!chiavi.length) return '';
  chiavi.sort(function(a, b){ return (v[b].quando || 0) - (v[a].quando || 0); });
  return '<div class="h2">Cosa sta guardando<span class="r">' + chiavi.length + ' mercati</span></div><div class="card" style="padding:6px 14px">' +
    '<table class="tab-d"><tr><th>Mercato</th><th>Punti</th><th>Perche\'</th></tr>' + chiavi.map(function(ep){
      var x = v[ep], m = String(x.motivo || '');
      var tono = m === 'aperta' ? 'pos' : /errore|rifiutato/i.test(m) ? 'neg' : '';
      return '<tr><td class="t">' + esc(nomeDi(ep)) + '<div class="piccolo">' + durata(adesso - x.quando) + ' fa</div></td>' +
        '<td>' + (x.punti != null ? M.segno(x.punti) : '—') + '</td><td class="' + tono + '" style="text-align:left;white-space:normal;font-size:12px;font-family:var(--sys)">' + esc(m === 'aperta' ? 'Aperta!' : m) + '</td></tr>';
    }).join('') + '</table><p class="piccolo" style="margin:8px 0 6px">Entra da ' + M.sogliaProfilo('estremo') + ' punti in su (o in giu\', per vendere), quando il momento e\' giusto. ' +
    'Il ponte salva queste righe ogni cinque minuti.</p></div>';
}

function tabRobot(){
  var h = '';
  if(S.modo !== 'vero'){
    h += '<div class="card"><div class="vuoto"><b>Il robot lavora sul tuo conto</b>Apre e chiude da solo attraverso il ponte su Cloudflare, anche con l\'app chiusa. ' +
      'Prima collega il ponte dalla scheda <b>Ponte</b>.</div></div>';
    return h + robotRegoleHTML() + robotStoriaHTML();
  }
  var R = S.robot;
  if(!R){ caricaRobot(); return h + '<div class="card"><div class="vuoto"><b>Chiedo al ponte…</b></div></div>'; }
  if(R.vecchio || (R.versione && parseFloat(R.versione) < 2.1)){
    return h + '<div class="nota warn"><b>Il ponte su Cloudflare e\' la versione vecchia.</b> Ricopialo: apri ' +
      '<a href="https://github.com/w8997wnwy5-collab/capital_com/blob/claude/sleepy-ptolemy-xwmkf5/server/worker.js" target="_blank" rel="noopener">server/worker.js</a> › ' +
      '<b>Copy raw file</b>; su Cloudflare, il tuo Worker › <b>Edit code</b> › cancella tutto, incolla › <b>Deploy</b>. Poi torna qui.' +
      (R.robot && R.robot.acceso ? ' Il robot vecchio e\' ancora acceso: dopo, premi <b>Ferma</b> e poi <b>Avvia</b>.' : '') + '</div>' + robotRegoleHTML();
  }
  if(R.errore) return h + '<div class="nota warn">' + esc(R.errore) + '</div><button class="btn" onclick="caricaRobot()">Riprova</button>';
  if(!R.memoria) return h + '<div class="nota warn">Al Worker manca il deposito <b>MEMORIA</b> (KV): senza, il robot non puo\' ricordare cosa ha aperto. ' +
    'Istruzioni nella guida del ponte.</div>';

  var rb = R.robot || {}, cmd = R.comando, conto = R.conto || {}, val = conto.valuta || valutaConto();
  var adesso = (R.ora || Date.now()) + (Date.now() - S.robotQuando);
  var acceso = cmd ? cmd.azione === 'avvia' : !!rb.acceso;
  var stile = (cmd && cmd.impostazioni && cmd.impostazioni.stile) || (rb.acceso && rb.stile) || S.cfg.stile;
  if(!M.STILI[stile]) stile = 'swing';
  var battito = rb.battito && rb.battito.quando ? adesso - rb.battito.quando : null;
  var risultato = R.risultato, perdita = risultato != null ? Math.max(0, -risultato) : 0;
  var tetto = (cmd && cmd.impostazioni && cmd.impostazioni.perditaMax) || rb.perditaMax || S.cfg.robotPerdita || 50;
  var quota = Math.min(1, perdita / tetto);

  /* il cron gira? lo si capisce dal comando che resta in attesa o dal battito vecchio */
  var cron = '<b>Settings › Triggers</b> (o <b>Trigger events</b>) › <b>Cron Triggers › Add</b>, scrivi <b>* * * * *</b> e salva';
  var provaGiro = '<button class="btn picc" style="margin-top:10px" onclick="giroAdesso()"' + (S.robotOccupato ? ' disabled' : '') + '>Fai un giro adesso</button>';
  var erroreGiro = rb.battito && rb.battito.errore ? rb.battito.errore : '';
  if(erroreGiro && battito != null && battito < 15 * 60000){
    h += '<div class="nota warn"><b>Il robot gira, ma l\'ultimo giro (' + durata(battito) + ' fa) si e\' fermato su un errore:</b> ' + esc(erroreGiro) + provaGiro + '</div>';
  } else if(cmd && adesso - cmd.quando > 150000){
    h += '<div class="nota warn"><b>Il robot non gira.</b> Hai premuto ' + (cmd.azione === 'avvia' ? 'Avvia' : 'Ferma') + ' ' + durata(adesso - cmd.quando) +
      ' fa e il ponte non l\'ha ancora fatto. Quasi sempre manca l\'orologio di Cloudflare. Nel tuo Worker: ' + cron + '. ' +
      'Prova anche il tasto qui sotto: fa un giro a mano e ti dice se il ponte e Capital.com rispondono, o su quale errore si ferma.' + provaGiro + '</div>';
  } else if(cmd){
    h += '<div class="nota acc">' + (cmd.azione === 'avvia' ? '<b>Si accende al prossimo giro</b>, entro un minuto o due. Su Telegram arriva <b>ROBOT ACCESO</b>: e\' la prova che l\'orologio di Cloudflare gira.'
                                                         : '<b>Si ferma al prossimo giro</b>, entro un minuto o due.' + (cmd.chiudi ? ' Le posizioni che conosceva le ha gia\' chiuse.' : '')) + '</div>';
  } else if(rb.acceso && (battito == null || battito > 15 * 60000)){
    h += '<div class="nota warn"><b>Il robot non sta girando</b>' + (battito != null ? ': l\'ultimo giro e\' di ' + durata(battito) + ' fa' : '') + '. Nel tuo Worker su Cloudflare controlla l\'orologio (' + cron + ') e i <b>Logs</b>.' + provaGiro + '</div>';
  }

  var titolo = cmd ? (cmd.azione === 'avvia' ? 'Si sta accendendo' : 'Si sta fermando') : (acceso ? 'Il robot e\' acceso' : 'Il robot e\' spento');
  var sotto = cmd ? (cmd.azione === 'avvia' ? M.STILI[stile].nome + ', tetto ' + fmt(tetto, 0) + ' ' + esc(val) + '.' : 'Non apre piu\' niente.')
    : acceso ? 'Da ' + durata(adesso - rb.avviato) + ' · ' + M.STILI[stile].nome + ' · ultimo giro ' + (battito != null ? durata(battito) + ' fa' : '—') + '. Lavora anche con l\'app chiusa.'
    : rb.motivo === 'tetto' ? 'Si e\' fermato da solo: ha raggiunto la perdita massima.'
    : rb.fermato ? 'Fermato ' + giornoOra(rb.fermato) + '.' : 'Non e\' mai stato acceso.';
  var colpi = rb.colpi || { n: 0, vinti: 0 };
  h += '<div class="hero"><svg class="mirino" viewBox="0 0 100 100" aria-hidden="true">' + MIRINO_SVG + '</svg>' +
    '<div class="l">' + (R.demo ? 'Conto demo' : 'Conto reale') + ' · profilo Estremo</div>' +
    '<div class="v">' + titolo + '</div><div class="s">' + sotto + '</div>' +
    (rb.capitaleIniziale != null && !(cmd && cmd.azione === 'avvia') ? '<div class="riga"><div>Dall\'avvio<b>' + (risultato != null ? soldiS(risultato, 2) : '—') + '</b></div>' +
      '<div>Posizioni<b>' + (rb.aperte || []).length + ' / ' + (rb.maxPosizioni || 10) + '</b></div>' +
      '<div>Colpi<b>' + (colpi.n ? colpi.vinti + ' vinti su ' + colpi.n : '—') + '</b></div></div>' : '') + '</div>';
  if(rb.capitaleIniziale != null && !(cmd && cmd.azione === 'avvia')){
    h += '<div class="card" style="padding:13px 15px"><div class="piccolo" style="display:flex;justify-content:space-between;margin-bottom:6px"><span>Perdita dall\'avvio</span>' +
      '<span class="num">' + fmt(perdita, 2) + ' / ' + fmt(tetto, 0) + ' ' + esc(val) + '</span></div>' +
      '<div class="barra" style="min-width:0"><i class="c" style="right:auto;left:0;width:' + (quota * 100).toFixed(1) + '%;background:' + (quota > 0.7 ? 'var(--warn)' : 'var(--amber)') + '"></i></div></div>';
  }

  if(acceso){
    h += '<div class="fila"><button class="btn" onclick="fermaRobot(false)"' + (S.robotOccupato ? ' disabled' : '') + '>Ferma</button>' +
      '<button class="btn ko" onclick="fermaRobot(true)"' + (S.robotOccupato ? ' disabled' : '') + '>Ferma e chiudi tutto</button></div>' +
      '<p class="piccolo" style="margin:8px 3px 14px"><b>Ferma</b>: non apre piu\' niente, le posizioni aperte le porta a fine con le loro regole. <b>Ferma e chiudi tutto</b>: chiude subito. ' +
      'Da Telegram: /stop e /chiudi. Per cambiare stile: Ferma, poi Avvia con lo stile nuovo.</p>';
  } else {
    var t = S.cfg.robotPerdita || 50;
    h += '<div class="card"><div class="h2" style="margin:0 0 10px">Prima di accenderlo</div>' +
      '<div class="seg" style="margin-bottom:6px">' + Object.keys(M.STILI).map(function(k){
        return '<button class="' + (S.cfg.stile === k ? 'on' : '') + '" onclick="impostaStile(\'' + k + '\')">' + M.STILI[k].nome + '</button>';
      }).join('') + '</div><p class="piccolo" style="margin:0 0 12px">' + fraseStile(S.cfg.stile) +
      (S.cfg.stile !== 'rapido' ? ' Per entrare, incassare e uscire tante volte al giorno scegli <b>Rapido</b>.' : '') + '</p>' +
      '<div class="fila"><div class="campo" style="flex:1"><label for="rb-perdita">Perdita massima (' + esc(val) + ')</label>' +
      '<input id="rb-perdita" type="number" inputmode="decimal" min="1" step="5" value="' + t + '" oninput="campoRobot(\'robotPerdita\', this.value)"></div>' +
      '<div class="campo" style="flex:1"><label for="rb-posti">Posizioni al massimo</label>' +
      '<input id="rb-posti" type="number" inputmode="numeric" min="1" max="10" step="1" value="' + (S.cfg.robotPosti || 10) + '" oninput="campoRobot(\'robotPosti\', this.value)"></div></div>' +
      levaHTML(conto) +
      '<p class="piccolo" style="margin:0 0 12px">Rischio a colpo <b class="num">' + fmt(M.rischioRobot(t, 'A'), 2) + '</b> su un A, <b class="num">' + fmt(M.rischioRobot(t, 'C'), 2) + '</b> su un C · ' +
      S.cfg.lista.length + ' mercati · disponibili sul conto <b class="num">' + (conto.disponibile != null ? fmt(conto.disponibile, 2) : '—') + ' ' + esc(val) + '</b>. ' +
      'Il tetto conta da quando premi Avvia. Le posizioni al massimo contano anche le tue.</p>' +
      (R.telegram ? '' : '<div class="nota amb">Telegram non e\' collegato: il robot lavora lo stesso, ma non ti scrive cosa fa e non puoi fermarlo da li\'.</div>') +
      '<button class="btn acc" onclick="avviaRobot()"' + (S.robotOccupato ? ' disabled' : '') + '>Avvia il robot · ' + M.STILI[S.cfg.stile].nome + '</button></div>';
  }

  var aperte = rb.aperte || [];
  h += '<div class="h2">Le sue posizioni<span class="r">' + aperte.length + '</span></div>';
  if(!aperte.length) h += '<div class="card"><div class="vuoto" style="padding:14px">' + (acceso ? 'Nessuna, per ora: qui sotto vedi perche\'.' : 'Nessuna.') + '</div></div>';
  else h += '<div class="card" style="padding:6px 14px"><table class="tab-d"><tr><th>Mercato</th><th>Entrata</th><th>Stop</th><th>Ora</th></tr>' + aperte.map(function(a){
    var r = a.prezzo != null && a.R > 0 ? (a.prezzo - a.entrata) * a.dir / a.R : null;
    return '<tr><td class="t">' + freccia(a.dir) + ' ' + esc(a.nome || a.epic) + '<div class="piccolo">' + fmt(a.dim, a.dim % 1 ? 2 : 0) + ' · ' + giornoOra(a.aperta) + '</div></td>' +
      '<td>' + prezzo(a.entrata) + '</td><td>' + prezzo(a.stop != null ? a.stop : a.stopIniziale) + '</td>' +
      '<td class="' + (r == null ? '' : r >= 0 ? 'pos' : 'neg') + '">' + (r != null ? erre(r) : '—') + '</td></tr>';
  }).join('') + '</table></div>';

  if(acceso || rb.acceso) h += vistiHTML(rb, adesso);

  var diario = rb.diario || [];
  if(diario.length){
    h += '<div class="h2">Cosa ha fatto</div><div class="card" style="padding:8px 14px">' + diario.slice(0, 15).map(function(d){
      var tono = d.tipo === 'errore' || d.tipo === 'tetto' ? 'neg' : d.tipo === 'aperta' ? 'pos' : '';
      return '<div style="padding:8px 0;border-bottom:1px solid var(--line2);font-size:13px;line-height:1.45"><span class="num muto" style="font-size:11px">' + giornoOra(d.quando) +
        '</span><br><span class="' + tono + '">' + esc(d.testo) + '</span></div>';
    }).join('') + '</div>';
  }
  h += robotRegoleHTML(acceso ? stile : S.cfg.stile) + robotStoriaHTML();
  h += '<p class="piccolo" style="margin:14px 3px 0">Il robot puo\' perdere tutta la perdita massima, e in fretta: con la leva un periodo storto arriva prima di quanto sembri. ' +
    'Il tetto lo ferma li\'; i buchi di prezzo (notizie, aperture del lunedi\') possono superarlo di poco.</p>';
  return h;
}

/* Un giro fatto a mano dall'app: serve a capire se il problema e' l'orologio
   di Cloudflare (il giro a mano funziona) o il ponte e Capital.com (si ferma
   su un errore, e qui si legge quale). */
function giroAdesso(){
  S.robotOccupato = true; render();
  chiediPonte('/api/sorveglia', { metodo: 'POST' }).then(function(d){
    var r = (d && d.robot) || {};
    if(d && d.saltato) mostraAvviso('Giro saltato', d.saltato + '. Riprova fra un minuto.');
    else if(r.errore) mostraAvviso('Il giro si ferma su un errore', r.errore);
    else mostraAvviso('Il giro a mano funziona', 'Il ponte e Capital.com rispondono, e il comando e\' stato applicato. Quindi manca solo l\'orologio: nel tuo Worker su Cloudflare, ' +
      'Settings › Triggers (o Trigger events) › Cron Triggers › Add › * * * * * › salva. Finche\' non c\'e\', il robot non gira da solo.');
  }, function(e){ mostraAvviso('Il giro si ferma su un errore', e.message); })
  .then(function(){ S.robotOccupato = false; return caricaRobot(); });
}

/* La leva: con un conto piccolo e' lei, con il margine, a decidere quanto
   e' grande una posizione. Qui si vede quanto si muove adesso e quanto con
   la leva al massimo, e si sceglie se il robot la deve alzare. */
function levaHTML(conto){
  var leve = S.leve || {}, righe = [], dispo = conto && conto.disponibile > 0 ? conto.disponibile * M.ROBOT.margineUsabile : 0;
  ['INDICES', 'SHARES', 'COMMODITIES', 'CRYPTOCURRENCIES', 'CURRENCIES'].forEach(function(tipo){
    var v = leve[tipo];
    if(!v || !v.available || !v.available.length) return;
    var max = Math.max.apply(null, v.available), nome = { INDICES: 'indici', SHARES: 'azioni', COMMODITIES: 'materie prime', CRYPTOCURRENCIES: 'cripto', CURRENCIES: 'valute' }[tipo];
    righe.push(nome + ' <b class="num">' + v.current + ':1</b>' + (max > v.current ? ' → <b class="num">' + max + ':1</b>' : ' (massimo)') +
      (dispo ? ' · posizioni fino a ' + fmt(dispo * (S.cfg.robotLeva ? max : v.current), 0) + ' ' + esc(valutaConto()) : ''));
  });
  return '<label class="piccolo" style="display:flex;gap:10px;align-items:flex-start;margin:0 0 8px;cursor:pointer">' +
    '<input type="checkbox" style="margin-top:3px"' + (S.cfg.robotLeva ? ' checked' : '') + ' onchange="S.cfg.robotLeva = this.checked; salvaCfg(); render()">' +
    '<span><b>Leva al massimo su Capital.com.</b> All\'avvio il robot alza la leva al massimo che il tuo conto concede: con lo stesso margine apre posizioni piu\' grandi, ' +
    'e guadagni e perdite corrono piu\' veloci. Il tetto di perdita resta quello.</span></label>' +
    (righe.length ? '<p class="piccolo" style="margin:0 0 12px">' + righe.join('<br>') + '</p>' : '');
}

function campoRobot(k, v){
  var x = parseFloat(String(v).replace(',', '.'));
  if(k === 'robotPosti') x = Math.max(1, Math.min(10, Math.round(x) || 10));
  if(x > 0){ S.cfg[k] = x; salvaCfg(); S.robotStoria = null; }
}

function avviaRobot(){
  var R = S.robot || {}, val = (R.conto && R.conto.valuta) || valutaConto();
  var perdita = S.cfg.robotPerdita || 50, posti = S.cfg.robotPosti || 10, st = M.STILI[S.cfg.stile];
  var conto = R.demo ? 'DEMO' : 'REALE';
  if(!confirm('Il robot aprira\' e chiudera\' posizioni da solo sul conto ' + conto + ', profilo Estremo, stile ' + st.nome + ', fino a ' + posti + ' posizioni.\n\n' +
              'Rischia fino a ' + fmt(M.rischioRobot(perdita, 'A'), 2) + ' ' + val + ' a colpo' + (S.cfg.robotLeva ? ' e alza la leva al massimo su Capital.com' : '') +
              '. Si ferma da solo e chiude tutto se perde ' + fmt(perdita, 0) + ' ' + val + ' da adesso.\n\nAvvio?')) return;
  S.robotOccupato = true; render();
  chiediPonte('/api/robot/avvia', { metodo: 'POST', corpo: { perditaMax: perdita, maxPosizioni: posti, stile: S.cfg.stile,
                                                             lista: S.cfg.lista, riferimento: S.cfg.riferimento, levaMassima: !!S.cfg.robotLeva } })
    .then(function(d){
      mostraAvviso('Robot in partenza', 'Si accende al prossimo giro, entro un minuto o due. ' + (d.webhook ? 'Su Telegram arriva ROBOT ACCESO; da li\': /stato /stop /chiudi.' : 'Fermalo da qui.') +
        ' Se fra due minuti qui c\'e\' ancora "Si sta accendendo", su Cloudflare manca l\'orologio (Cron Trigger).');
    }, function(e){ mostraAvviso('Non si accende', e.message); })
    .then(function(){ S.robotOccupato = false; return caricaRobot(); });
}

function fermaRobot(chiudi){
  if(chiudi && !confirm('Fermo il robot e chiudo SUBITO tutte le sue posizioni a mercato?')) return;
  S.robotOccupato = true; render();
  chiediPonte('/api/robot/ferma', { metodo: 'POST', corpo: { chiudi: !!chiudi } })
    .then(function(d){
      var male = (d.esiti || []).filter(function(e){ return !e.ok; }).length;
      mostraAvviso('Robot fermato', chiudi ? 'Chiuse ' + (d.esiti || []).filter(function(e){ return e.ok; }).length + ' posizioni' + (male ? ', ' + male + ' NON chiuse: riprova al prossimo giro, controlla su Capital.com.' : '.') +
                                             ' Al prossimo giro richiude quello che fosse partito nel frattempo.'
                                           : 'Non apre piu\' niente da adesso; le posizioni aperte le porta a fine.');
    }, function(e){ mostraAvviso('Non si ferma', e.message + ' Usa /stop su Telegram o chiudi da Capital.com.'); })
    .then(function(){ S.robotOccupato = false; return caricaRobot(); });
}

/* ══════════════════════════════════════════════════════════════
   PRECISIONE
   ══════════════════════════════════════════════════════════════ */
function tabPrecisione(){
  var h = bannerEsempio(), cal = S.calib, prof = M.PROFILI[S.cfg.profilo], st = M.STILI[S.cfg.stile];
  if(!cal || !cal.tutti.n){
    return h + '<div class="card"><div class="vuoto"><b>Niente da misurare</b>La storia dei mercati in lista e\' troppo corta, o nessun segnale ha superato la soglia del profilo.</div></div>';
  }
  var t = M.riassumi(S.colpiPortafoglio), rischio = (S.cfg.budget || 0) * prof.rischio * 0.85;
  var solidita = Math.abs(t.tStat) >= 3 ? 'difficilmente e\' fortuna' : Math.abs(t.tStat) >= 2 ? 'probabilmente non e\' fortuna, ma il margine e\' stretto' : 'potrebbe essere fortuna';
  var anni = S.colpiPortafoglio.length ? (S.colpiPortafoglio[S.colpiPortafoglio.length - 1].t - S.colpiPortafoglio[0].t) / (365.25 * 86400000) : 0;
  h += '<div class="h2">Ci si puo\' fidare?</div><div class="card"><p style="margin:0;font-size:15px;line-height:1.6">' +
    'Rigiocando ' + (anni >= 1 ? 'gli ultimi ' + fmt(anni, 1) + ' anni' : 'gli ultimi ' + fmt(anni * 12, 0) + ' mesi') + ' di ' + S.cfg.lista.length + ' mercati, con le regole del profilo <b>' + prof.nome +
    '</b> in stile <b>' + st.nome + '</b> e al massimo ' + prof.colpi + ' colpi aperti insieme, il motore avrebbe fatto <b>' + t.n + ' colpi</b>: ' + fmt(t.pVince * 100, 0) + '% in guadagno, <b>' + erre(t.rMedio) + '</b> in media.' +

function campoFoglio(k, v, numero){
  if(!S.foglio) return;
  if(numero && k !== 'quandoTesto') v = parseFloat(String(v).replace(',', '.'));
  S.foglio.dati[k] = v;
  if(k === 'epic' || k === 'dir'){
    var d = S.foglio.dati, px = prezzoVivo(d.epic);
    if(px) d.entrata = +(d.dir > 0 ? px.ask : px.bid).toFixed(M.decimaliPer(px.bid));
    var p = pianoDi(d.epic, d.dir);
    if(p){ d.dim = p.dim; d.stop = +p.stop.toFixed(M.decimaliPer(p.stop)); }
    render();
  }
}
function chiudiFoglio(){ S.foglio = null; render(); }
function testoQuando(ms){
  var d = new Date(ms - new Date(ms).getTimezoneOffset() * 60000);
  return d.toISOString().slice(0, 16);
}

   ══════════════════════════════════════════════════════════════ */
function vai(t){ S.tab = t; history.replaceState(null, '', '#' + t); render(); window.scrollTo(0, 0); if(t === 'radar') caricaScoperte(); if(t === 'robot') caricaRobot(); }
function scegli(ep){ if(!ep) return; S.scelto = ep; vai('colpo'); }

function impostaBudget(v){
  var x = parseFloat(String(v).replace(',', '.'));
  S.cfg.budget = x > 0 ? x : null;
  salvaCfg();
  inviaImpostazioni();
  render();
}
function impostaProfilo(k){
  S.cfg.profilo = k; salvaCfg();
  inviaImpostazioni();
  analizzaTutto(); render();
}
function impostaStile(k){
  if(S.cfg.stile === k) return;
  S.cfg.stile = k; salvaCfg();
  S.cs = {}; S.ct = {};
  /* il ponte deve leggere le posizioni aperte con lo stesso stile */
  var segui = leggi(CHIAVI.segui, {});
  Object.keys(segui).forEach(function(id){ segui[id].stile = k; avvisaPonte(id, segui[id]); });
  scrivi(CHIAVI.segui, segui);
  S.stato = 'carico'; carica(true);
}
function impostaRiferimento(e){ S.cfg.riferimento = e; salvaCfg(); S.stato = 'carico'; carica(true); }

function sonoEntrato(ep){
  var p = pianoDi(ep);
  if(!p) return;
  var apri = function(){
    var px = prezzoVivo(ep);
    S.foglio = { tipo: 'entrato', dati: { epic: ep, dir: p.dir, entrata: +(px ? (p.dir > 0 ? px.ask : px.bid) : p.entrata).toFixed(M.decimaliPer(p.entrata)),
      dim: p.dim, stop: +p.stop.toFixed(M.decimaliPer(p.stop)), quandoTesto: testoQuando(Date.now()), R: p.R, punti: (S.analisi[ep] || {}).punti } };
    render();
  };
  if(S.modo !== 'vero'){ apri(); return; }
  /* prima si guarda se Capital.com la vede gia' */
  mostraAvviso('Guardo su Capital.com…', 'Cerco la posizione appena aperta.');
  aggiornaPosizioni(false).then(function(){
    var trovata = posizioniTutte().filter(function(x){ return x.capital && x.epic === ep && x.dir === p.dir && Date.now() - x.aperta < 3 * 3600000; })[0];
    if(trovata){
      var segui = leggi(CHIAVI.segui, {});
      var imp = Object.assign(segui[trovata.id] || {}, { puntiEntrata: (S.analisi[ep] || {}).punti, stile: S.cfg.stile });
      if(trovata.stopBroker == null){ imp.R = p.R; imp.stopMentale = p.stop; delete imp.stopIniziale; }
      segui[trovata.id] = imp; scrivi(CHIAVI.segui, segui); avvisaPonte(trovata.id, imp);
      mostraAvviso('Trovata', nomeDi(ep) + ' ' + verso(p.dir).toLowerCase() + ': ' + fmt(trovata.dim, trovata.dim % 1 ? 2 : 0) + ' a ' + prezzo(trovata.entrata) + ' alle ' + ora(trovata.aperta) + '. La sorveglio io.');
      vai('gioco');
    } else apri();
  });
}

function apriManuale(){
  var ep = S.scelto || S.cfg.lista[0], an = S.analisi[ep] || {}, dir = an.dir || 1, px = prezzoVivo(ep), p = pianoDi(ep, dir);
  S.foglio = { tipo: 'mano', dati: { epic: ep, dir: dir, entrata: px ? +(dir > 0 ? px.ask : px.bid).toFixed(M.decimaliPer(px.bid)) : null,
    dim: p ? p.dim : null, stop: p ? +p.stop.toFixed(M.decimaliPer(p.stop)) : null, quandoTesto: testoQuando(Date.now()) } };
  render();
}

function salvaPosizione(){
  var d = S.foglio.dati;
  if(!(d.entrata > 0) || !(d.dim > 0)){ mostraAvviso('Manca qualcosa', 'Servono prezzo d\'entrata e quantita\'.'); return; }
  var aperta = d.quandoTesto ? new Date(d.quandoTesto).getTime() : Date.now();
  if(!isFinite(aperta)) aperta = Date.now();
  var stopOk = d.stop > 0 && (d.stop - d.entrata) * d.dir < 0;
  var pos = { id: 'm' + Date.now().toString(36), epic: d.epic, nome: nomeDi(d.epic), dir: d.dir, entrata: d.entrata, dim: d.dim, aperta: aperta,
              stop: stopOk ? d.stop : null, stopIniziale: stopOk ? d.stop : undefined, R: stopOk ? undefined : d.R,
              puntiEntrata: d.punti != null ? d.punti : (S.analisi[d.epic] || {}).punti, valuta: (S.mercati[d.epic] || {}).valuta,
              passo: (S.mercati[d.epic] || {}).passo };
  var lista = leggi(CHIAVI.mano, []);
  lista.push(pos);
  scrivi(CHIAVI.mano, lista);
  avvisaPonte(pos.id, { stile: S.cfg.stile, R: pos.R, stopIniziale: pos.stopIniziale, puntiEntrata: pos.puntiEntrata, passo: pos.passo },
              { manuale: true, epic: pos.epic, nome: pos.nome, dir: pos.dir, entrata: pos.entrata, dim: pos.dim, aperta: pos.aperta, stop: pos.stop, valuta: pos.valuta });
  S.foglio = null;
  S.verdetti[pos.id] = null;
  vai('gioco');
  mostraAvviso('Ti seguo', nomeDi(pos.epic) + ' ' + verso(pos.dir).toLowerCase() + ' da ' + prezzo(pos.entrata) + '. Ti dico io quando uscire.');
}

function trovaPosizione(id){ return posizioniTutte().filter(function(p){ return p.id === id; })[0]; }

function segna(id, cosa){
  var p = trovaPosizione(id);
  if(!p) return;
  var c = consiglioDi(p), cambi = {};
  if(cosa === 'parziale'){
    cambi.parziale = true;
    if(c) cambi[p.manuale ? 'stop' : 'stopMentale'] = c.stopRegola;
    /* a mano: la meta' chiusa va nel libro, la posizione resta con l'altra.
       Su Capital.com la meta' e' una posizione a parte che si chiude da sola
       al take profit, e nel libro ci finisce comunque. */
    if(p.manuale && c){
      var resta = M.giuAlPasso(p.dim / 2, p.passo || 0.01);
      if(resta > 0 && resta < p.dim){
        registraChiusura(Object.assign({}, p, { dim: p.dim - resta }), c.uscita, 'Meta\' incassata');
        cambi.dim = resta;
      }
    }
  }
  if(cosa === 'stop' && c) cambi[p.manuale ? 'stop' : 'stopMentale'] = c.stopRegola;
  if(cosa === 'rinforzata'){ cambi.rinforzata = true; if(p.manuale){ var agg = M.giuAlPasso(p.dim / 2, p.passo || 0.01); var px = (S.mercati[p.epic] || {}); var nuovo = p.dir > 0 ? px.ask : px.bid;
    if(agg > 0 && nuovo > 0){ cambi.entrata = (p.entrata * p.dim + nuovo * agg) / (p.dim + agg); cambi.dim = p.dim + agg; cambi.R = p.R || Math.abs(p.entrata - (p.stopIniziale || p.entrata)); } } }
  if(p.manuale) salvaManuale(id, cambi);
  else { var segui = leggi(CHIAVI.segui, {}); segui[id] = Object.assign(segui[id] || {}, cambi); scrivi(CHIAVI.segui, segui); }
  var q = trovaPosizione(id);
  avvisaPonte(id, { stile: S.cfg.stile, R: q.R, stopIniziale: q.stopIniziale, parziale: q.parziale, rinforzata: q.rinforzata, puntiEntrata: q.puntiEntrata, passo: q.passo },
              p.manuale ? { manuale: true, epic: q.epic, nome: q.nome, dir: q.dir, entrata: q.entrata, dim: q.dim, aperta: q.aperta, stop: q.stop, valuta: q.valuta } : null);
  S.verdetti[id] = null;
  render();
}

function apriChiusura(id){
  var p = trovaPosizione(id), mk = S.mercati[p.epic] || {};
  S.foglio = { tipo: 'chiudi', id: id, dati: { uscita: p.dir > 0 ? mk.bid : mk.ask } };
  render();
}
function confermaChiusura(){
  var f = S.foglio, p = trovaPosizione(f.id);
  if(!p || !(f.dati.uscita > 0)) return;
  registraChiusura(p, f.dati.uscita, 'Chiusa a mano');
  scrivi(CHIAVI.mano, leggi(CHIAVI.mano, []).filter(function(m){ return m.id !== f.id; }));
  if(S.modo === 'vero') chiediPonte('/api/segui/' + encodeURIComponent(f.id), { metodo: 'DELETE' }).catch(function(){});
  S.foglio = null;
  render();
}

function collega(){
  var url = (document.getElementById('ponte').value || '').trim(), chiave = (document.getElementById('chiaveP').value || '').trim();
  /* https sempre, tranne per un ponte di prova sul proprio computer */
  if(url && !/^https:\/\//.test(url) && !/^http:\/\/(localhost|127\.0\.0\.1)(:\d+)?/.test(url)) url = 'https://' + url.replace(/^http:\/\//, '');
  S.erroreCollega = null;
  if(!url || !chiave){ S.erroreCollega = 'Servono indirizzo e codice.'; render(); return; }
  var vecchio = { ponte: S.cfg.ponte, chiave: S.cfg.chiave };
  S.cfg.ponte = url; S.cfg.chiave = chiave;
  chiediPonte('/api/stato').then(function(st){
    if(!st.ok) throw new Error(st.problema || 'Il ponte risponde, Capital.com no.');
    S.cfg.esempio = false; salvaCfg();
    S.modo = 'vero'; S.mercati = {}; S.cs = {}; S.ct = {}; S.capPos = []; S.capPosCaricate = false; S.cambi = {};
    S.scoperte = null; S.verdetti = {};
    mostraAvviso('Collegato', (st.demo ? 'Conto demo' : 'Conto reale') + (st.conto ? ' · ' + st.conto.nome : '') + '. Carico i tuoi mercati.');
    S.stato = 'carico'; carica(true);
  }).catch(function(e){
    S.cfg.ponte = vecchio.ponte; S.cfg.chiave = vecchio.chiave;
    S.erroreCollega = e.message; render();
  });
}
function usaEsempio(){
  S.cfg.esempio = true; salvaCfg();
  S.modo = 'esempio'; S.mercati = {}; S.cs = {}; S.ct = {}; S.capPos = []; S.capPosCaricate = false; S.cambi = {}; S.scoperte = null; S.verdetti = {};
  S.stato = 'carico'; carica(true);
}
function impostaIngressi(si){ S.cfg.avvisiIngresso = !!si; salvaCfg(); inviaImpostazioni(); render(); }
function provaTelegram(){
  chiediPonte('/api/telegram/prova', { metodo: 'POST' }).then(function(){ mostraAvviso('Mandato', 'Guarda su Telegram.'); },
    function(e){ mostraAvviso('Telegram non risponde', e.message); });
}
function chiediNotifiche(){
  if(!('Notification' in window)){ mostraAvviso('Non qui', 'Questo browser non fa notifiche. Su iPhone: aggiungi l\'app alla schermata Home.'); return; }
  Notification.requestPermission().then(function(){ render(); });
}

var timerCerca = null;
function cerca(t){
  S.cerca.testo = t;
  clearTimeout(timerCerca);
  if(t.trim().length < 2){ S.cerca.risultati = null; render(); return; }
  timerCerca = setTimeout(function(){
    S.cerca.inCorso = true; render();
    chiedi('markets', { searchTerm: t.trim() }).then(function(d){
      S.cerca.risultati = (d.markets || []).filter(function(m){ return m.instrumentType !== 'CURRENCIES'; });
    }, function(){ S.cerca.risultati = []; }).then(function(){ S.cerca.inCorso = false; render(); });
  }, 350);
}
function aggiungiMercato(ep){
  if(S.cfg.lista.indexOf(ep) >= 0){ scegli(ep); return; }
  S.cfg.lista.push(ep); salvaCfg(); inviaImpostazioni();
  mostraAvviso('Aggiunto', ep + ': leggo le candele.');
  caricaMercati([ep]).then(caricaCambi).then(function(){ return Promise.all([caricaCandele(ep), caricaFolla([ep])]); }).then(function(){
    analizzaTutto(); render();
  });
}
function togliMercato(ep){
  S.cfg.lista = S.cfg.lista.filter(function(e){ return e !== ep; }); salvaCfg(); inviaImpostazioni();
  analizzaTutto(); render();
}
function ripristinaLista(){ S.cfg.lista = LISTA_BASE.slice(); salvaCfg(); S.stato = 'carico'; carica(true); }
function cancellaTutto(){
  if(!confirm('Cancello budget, lista, posizioni a mano e libro da questo telefono?')) return;
  Object.keys(CHIAVI).forEach(function(k){ try{ localStorage.removeItem(CHIAVI[k]); }catch(e){} });
  location.reload();
}
function aggiorna(){ if(S.stato === 'pronto') carica(true); }

/* ══════════════════════════════════════════════════════════════
   DISEGNO
   ══════════════════════════════════════════════════════════════ */
var MIRINO_SVG = '<circle cx="50" cy="50" r="30" fill="none" stroke="currentColor" stroke-width="6"/>' +
  '<path d="M50 6v22M50 72v22M6 50h22M72 50h22" stroke="currentColor" stroke-width="6" stroke-linecap="round"/><circle cx="50" cy="50" r="5" fill="currentColor"/>';

var TABS = [
  { k: 'radar', n: 'Radar', p: 'M12 3a9 9 0 1 0 9 9M12 7a5 5 0 1 0 5 5M12 12l7-7' },
  { k: 'colpo', n: 'Colpo', p: 'M12 2v4M12 18v4M2 12h4M18 12h4M12 6a6 6 0 1 0 0 12a6 6 0 1 0 0-12M12 11v2' },
  { k: 'robot', n: 'Robot', p: 'M13 2 4 14h7l-1 8 9-12h-7z' },
  { k: 'gioco', n: 'In gioco', p: 'M3 12h4l3-8 4 16 3-8h4' },
  { k: 'precisione', n: 'Precisione', p: 'M4 20V10M10 20V4M16 20v-7M22 20H2' },
  { k: 'ponte', n: 'Ponte', p: 'M2 17h20M5 17v-5a7 7 0 0 1 14 0v5M9 17v-4M15 17v-4' }
];
var TITOLI = { radar: 'Dove giocare', colpo: 'Il colpo', robot: 'Il robot', gioco: 'In gioco', precisione: 'Precisione', ponte: 'Il ponte' };

function sottotitolo(){
  var st = M.STILI[S.cfg.stile].nome;
  if(S.tab === 'ponte') return S.modo === 'vero' ? (S.ponte && S.ponte.demo ? 'Capital.com · demo' : 'Capital.com · conto reale') : 'Dati d\'esempio';
  if(S.tab === 'gioco') return posizioniTutte().length + ' aperte · aggiornato ' + ora(Date.now());
  var n = S.cfg.lista.length;
  return n + ' mercati · ' + st + ' · ' + M.PROFILI[S.cfg.profilo].nome + ' · ' + ora(S.ultimoGiro || Date.now());
}

function schermataCarico(){
  return '<div class="carico"><svg viewBox="0 0 100 100" style="color:var(--accent)"><g class="giro">' + MIRINO_SVG + '</g></svg>' +
    '<div style="font-size:22px;font-weight:700;letter-spacing:-.5px">Mirino</div>' +
    '<div class="bar"><i style="width:' + Math.round(S.avanzamento * 100) + '%"></i></div><div class="fase">' + esc(S.fase) + '</div></div>';
}
function schermataErrore(){
  return '<div class="wrap" style="padding-top:calc(var(--safet) + 40px)"><div class="card"><div class="vuoto"><b>Non riesco a leggere i mercati</b>' + esc(S.errore || '') + '</div>' +
    '<div class="fila"><button class="btn acc" onclick="S.stato=\'carico\';carica(true)">Riprova</button>' +
    (S.modo === 'vero' ? '<button class="btn" onclick="usaEsempio()">Usa i dati d\'esempio</button>' : '') + '</div></div></div>';
}
/* La prima domanda, l'unica che l'app fa: quanto vuoi mettere. */
function schermataBenvenuto(){
  return '<div class="benvenuto"><svg viewBox="0 0 100 100" width="64" height="64" style="color:var(--accent)">' + MIRINO_SVG + '</svg>' +
    '<h1>Leva alta,<br>mira stretta.</h1><p class="tag">Leggo i mercati di Capital.com, ti dico dove entrare, quanto mettere e quando uscire. Prima, una domanda sola.</p>' +
    '<div class="h2" style="margin:0 0 4px">Quanto vuoi mettere in gioco?</div>' +
    '<div class="budget"><input id="budget0" type="number" inputmode="decimal" min="0" step="50" placeholder="2000"><span>' + valutaConto() + '</span></div>' +
    '<p class="piccolo" style="margin:-4px 0 18px">La parte del conto che decidi di rischiare. Profilo di partenza: <b>Aggressivo</b>, medio-alto: 4% del budget a colpo. Si cambia quando vuoi.</p>' +
    '<button class="btn acc" onclick="var v=document.getElementById(\'budget0\').value;if(parseFloat(v)>0){impostaBudget(v);}">Si parte</button>' +
    '<p class="piccolo" style="margin-top:16px;text-align:center">Il trading a leva puo\' far perdere piu\' di quanto pensi, in fretta. Mirino non garantisce niente: misura, e te lo dice.</p></div>';
}

function render(){
  var app = document.getElementById('app');
  var att = document.activeElement, fuoco = null;
  if(att && att.id && (att.tagName === 'INPUT' || att.tagName === 'SELECT')){
    /* si salva anche QUELLO CHE HAI SCRITTO, non solo dove stava il cursore:
       ridisegnare ricostruisce il campo da capo */
    fuoco = { id: att.id, testo: att.value, a: null, b: null };
    try{ fuoco.a = att.selectionStart; fuoco.b = att.selectionEnd; }catch(e){}
  }
  disegna(app);
  if(fuoco){
    var rif = document.getElementById(fuoco.id);
    if(rif && rif !== document.activeElement){
      try{
        if(fuoco.testo != null && rif.value !== fuoco.testo) rif.value = fuoco.testo;
        rif.focus({ preventScroll: true });
        if(fuoco.a != null) rif.setSelectionRange(fuoco.a, fuoco.b);
      }catch(e){}
    }
  }
}

function disegna(app){
  S.grafici = {};
  if(S.stato === 'carico'){ app.innerHTML = schermataCarico(); return; }
  if(S.stato === 'errore'){ app.innerHTML = schermataErrore(); return; }
  if(!S.cfg.budget && S.tab !== 'ponte'){ app.innerHTML = schermataBenvenuto(); return; }
  var corpo = S.tab === 'colpo' ? tabColpo() : S.tab === 'robot' ? tabRobot() : S.tab === 'gioco' ? tabGioco() : S.tab === 'precisione' ? tabPrecisione() :
              S.tab === 'ponte' ? tabPonte() : tabRadar();
  var modo = S.modo === 'vero' ? (S.ponte && S.ponte.demo ? '<span class="modo demo">demo</span>' : '<span class="modo vero">reale</span>') : '<span class="modo">esempio</span>';
  var h = '<div class="top"><div class="ttl"><h1>' + TITOLI[S.tab] + modo + '</h1><div class="sub">' + esc(sottotitolo()) + '</div></div>' +
    '<button class="ico' + (S.aggiornando ? ' gira' : '') + '" onclick="aggiorna()" aria-label="Aggiorna">' +
    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' +
    '<path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/></svg></button></div>';
  h += '<div class="wrap">' + corpo + '</div>';
  var u = urgenti();
  h += '<div class="tabs">' + TABS.map(function(t){
    return '<button class="tab ' + (S.tab === t.k ? 'on' : '') + '" onclick="vai(\'' + t.k + '\')">' +
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="' + t.p + '"/></svg>' +
      '<span>' + t.n + '</span>' + (t.k === 'gioco' && u ? '<i class="pallino">' + u + '</i>' : '') + '</button>';
  }).join('') + '</div>';
  h += foglioHTML();
  app.innerHTML = h;
}

document.addEventListener('keydown', function(e){ if(e.key === 'Escape' && S.foglio) chiudiFoglio(); });
if('serviceWorker' in navigator && location.protocol.indexOf('http') === 0){
  navigator.serviceWorker.register('sw.js').catch(function(){});
}
caricaCfg();
/* #gioco, #colpo e #colpo/NVDA: dai link dei messaggi su Telegram */
var ancora = decodeURIComponent((location.hash || '').slice(1)).split('/');
if(TITOLI[ancora[0]]) S.tab = ancora[0];
if(ancora[0] === 'colpo' && /^[A-Za-z0-9._-]{1,40}$/.test(ancora[1] || '')) S.sceltoDaLink = ancora[1];
window.addEventListener('hashchange', function(){
  var a = decodeURIComponent((location.hash || '').slice(1)).split('/');
  if(a[0] === 'colpo' && S.analisi[a[1]]){ S.scelto = a[1]; S.tab = 'colpo'; render(); window.scrollTo(0, 0); }
});
carica(false);
</script>
